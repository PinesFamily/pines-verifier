name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run registry:check
      - run: npx playwright install --with-deps chromium
      - name: Native capture with a synthetic HTTPS origin
        run: npm run test:capture
      - run: npm run build
      - name: Reproducible release archives (two builds, identical bytes)
        run: |
          set -euo pipefail
          node release.mjs --allow-dirty
          first=$(sha256sum release/*.zip)
          node release.mjs --allow-dirty
          test "$first" = "$(sha256sum release/*.zip)"
