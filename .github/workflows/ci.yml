name: Reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Extension package (ZIP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the package in a pinned container and compare its SHA-256 with release.json
        run: tools/tee-native/reproduce/extension.sh

  attestation-wasm:
    name: Attestation validator (WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the validator in a pinned container and compare with release/SHA256SUMS
        run: tools/tee-native/reproduce/attestation-wasm.sh
