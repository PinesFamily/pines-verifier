[package]
name = "pines-nitro-validation"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
attestation-doc-validation = { git = "https://github.com/evervault/attestation-doc-validation", rev = "a296a77c2b23fef8214131287423fe47c755eb3c" }
